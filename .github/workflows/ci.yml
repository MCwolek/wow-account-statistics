name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leafo/gh-actions-lua@v13.1.0
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@v6.1.1
      - run: luarocks install busted && luarocks install luacheck
      - run: luacheck AccountStatistics spec && busted
